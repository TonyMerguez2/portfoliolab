# Construire ailleurs, ne livrer que le résultat.
#
# ⚠️ **La machine de production ne construisait plus, elle survivait.** `next build` y tient
# un processus à 2,5 Go quand la machine en a 3,8, API et serveur vivant compris : la
# construction ne passait qu'en débordant sur le fichier d'échange, d'où huit à dix minutes
# à chaque mise à jour au lieu de deux. Et elle est déjà tombée — trois `oom-kill` d'affilée
# le 19 septembre 2026, à 3,0 Go, avant qu'un fichier d'échange de 4 Go ne soit posé. La
# marge restante n'est plus de la mémoire, c'est du disque lent, et chaque page ajoutée la
# grignote. Construire ici supprime le problème au lieu de le repousser.
#
# ⚠️ **Node 22, comme le serveur.** Il tourne en 22.23 ; construire en 24 ou 26 produirait
# un `.next` qu'on ne saurait pas dire compatible, et l'écart ne se verrait qu'en ligne.
#
# ⚠️ **Le cache de construction ne part pas.** Il pèse 1,3 Go à lui seul quand tout ce que
# `next start` lit en fait dix. Il appartient à la machine qui construit.

name: Déployer Novac

on:
  push:
    branches: [chore/react-19]
  workflow_dispatch:

# Deux déploiements qui se croisent, c'est une bascule sur une construction qui n'est pas la
# sienne. On attend son tour plutôt que d'annuler : un `push` déjà construit mérite d'arriver.
concurrency:
  group: deploiement-novac
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ⚠️ **Le secret est lu dans une variable, pour pouvoir tester son absence.** Un `if` ne
    # sait pas interroger `secrets` partout ; en passant par l'environnement, les trois
    # dernières étapes se sautent proprement tant que la clé n'est pas posée. Sans cela, le
    # premier `push` après l'ajout de ce fichier échouait au rsync — une croix rouge qui
    # n'aurait rien dit d'utile, puisque la construction, elle, serait passée.
    env:
      NOVAC_SSH_CLE: ${{ secrets.NOVAC_SSH_CLE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        working-directory: frontend
        run: npm ci

      # Les vérifications tournent ici et non sur le serveur : c'est le même travail, sur une
      # machine qui ne sert personne pendant ce temps.
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests
        working-directory: frontend
        run: npx vitest run

      - name: Construction
        working-directory: frontend
        run: npm run build

      # ⚠️ La clé de dépôt n'ouvre que le compte `novac`, qui n'a le droit de redémarrer que
      # les deux unités du site — voir `/etc/sudoers.d/novac-deploiement` sur la machine.
      # L'empreinte de l'hôte est écrite en clair : une clé publique d'hôte est publique par
      # construction, et la fixer vaut mieux qu'un `ssh-keyscan` qui accepte ce qu'il trouve.
      - name: Clé de dépôt
        if: env.NOVAC_SSH_CLE != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.NOVAC_SSH_CLE }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' 'novac.fyi ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICa/Se3SZ9iyO9nDirttVN7rXlkauFUM1T2kvvzBEyOJ' > ~/.ssh/known_hosts

      # `--delete` parce qu'un `.next-neuf` laissé par un envoi interrompu mêlerait deux
      # constructions, et qu'un manifeste d'une version avec les pages d'une autre ne se voit
      # qu'à l'exécution.
      - name: Envoi de la construction
        if: env.NOVAC_SSH_CLE != ''
        working-directory: frontend
        run: rsync -az --delete --exclude=cache/ .next/ novac@novac.fyi:/srv/novac/portfoliolab/frontend/.next-neuf/

      - name: Bascule
        if: env.NOVAC_SSH_CLE != ''
        run: ssh novac@novac.fyi /srv/novac/portfoliolab/deploiement/recevoir.sh "$GITHUB_SHA"

      - name: Sans clé, on s'arrête à la construction
        if: env.NOVAC_SSH_CLE == ''
        run: |
          echo "::notice::Le secret NOVAC_SSH_CLE n'est pas posé : le code est construit et vérifié, rien n'est déployé."
          echo "Voir deploiement/preparer-la-forge.sh."
