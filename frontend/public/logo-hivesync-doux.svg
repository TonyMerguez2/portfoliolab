<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!--
    Le logo, **au bord fondu**, pour servir de masque à la trame de points.

    ⚠️ Pourquoi un second fichier plutôt qu'un flou en CSS. Un masque à bord net tranche les
    points qu'il croise : le long du contour, la moitié d'un point s'affiche et l'autre non,
    ce qui donne des fragments carrés au lieu de points ronds. `filter: blur()` en CSS
    s'applique au *rendu* de l'élément, jamais à son masque ; la seule façon d'adoucir un
    masque est de fournir une image déjà floue. C'est ce fichier.

    ⚠️ L'écart-type vaut 6 unités du viewBox. Le masque est affiché à 1035 px pour 1200
    d'origine, soit 0,8625 : six unités valent donc 5,2 pixels à l'écran, et la transition
    d'un flou gaussien s'étale sur environ trois écarts-types — quinze pixels, soit un pas de
    trame. Chaque point traverse ainsi le bord en s'éteignant, entier, au lieu d'être coupé.

    ⚠️ La région du filtre est élargie de 20 % de chaque côté. Par défaut elle épouse la boîte
    du tracé, et le flou s'y trouverait tranché net — ce que le fondu doit précisément éviter.
  -->
  <filter id="fondu" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="6" />
  </filter>
  <g filter="url(#fondu)">
